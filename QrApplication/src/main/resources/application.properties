spring.application.name=QrApplication

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging.simp=DEBUG
logging.level.org.springframework.web.socket.sockjs=DEBUG

# DataSource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/QrApplication
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update

#product.image.dir=/opt/QR_APP_PRODUCT_IMAGE/

product.image.dir=D:/QR_APP_PRODUCT_IMAGE/

